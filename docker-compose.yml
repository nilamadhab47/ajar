services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ajar
      POSTGRES_PASSWORD: ajar
      POSTGRES_DB: ajar
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ajar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajar -d ajar"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  ajar_postgres:
